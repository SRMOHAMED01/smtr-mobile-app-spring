spring.application.name=backend

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5432/smtr_db
spring.datasource.username=smtr_user
spring.datasource.password=smtr_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# ddl-auto=update : pratique en dev, genere/adapte les tables depuis les entites.
# A remplacer par Flyway/validate quand le schema sera stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Upload de fichiers (photos) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- JWT ----
# Secret HMAC (256 bits minimum). A generer aleatoirement et a mettre en variable
# d'environnement en production, ne jamais commiter un vrai secret.
app.jwt.secret=changeMeToARandomBase64EncodedSecretKeyOfAtLeast32Bytes123456
app.jwt.expiration-ms=86400000

spring.application.name=backend

# Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

# Connection Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smtr_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver


server.port=8080
